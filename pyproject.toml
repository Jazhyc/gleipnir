[project]
name = "gleipnir-monitoring"
version = "0.1.0"
description = "Research infrastructure for distilling general-purpose AI control monitors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "accelerate",
    "datasets",
    "hydra-core",
    "huggingface-hub",
    "numpy",
    "pandas",
    "peft==0.19.1",
    "python-dotenv",
    "pyyaml",
    "requests",
    "safetensors",
    "scikit-learn",
    "torch",
    "transformers==5.14.1",
    "trl[vllm]==1.9.0",
    "vllm==0.24.0",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
gleipnir-openrouter = "gleipnir.openrouter_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gleipnir"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
