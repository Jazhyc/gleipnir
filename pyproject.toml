[project]
name = "gleipnir-monitoring"
version = "0.1.0"
description = "Research infrastructure for distilling general-purpose AI control monitors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "accelerate",
    "adjusttext>=1.3.0",
    "bitsandbytes",
    "datasets",
    "hydra-core",
    "huggingface-hub",
    "matplotlib>=3.9",
    "ninja>=1.13",
    "numpy",
    "pandas",
    "peft==0.19.1",
    "python-dotenv",
    "pyyaml",
    "requests",
    "safetensors",
    "scikit-learn",
    "seaborn>=0.13.2",
    "torch",
    "transformers==5.14.1",
    "trl==1.9.0",
    "vllm==0.31.0",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
gleipnir-openrouter = "gleipnir.teachers.openrouter_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gleipnir"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: starts local worker processes and requires local networking",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gleipnir", "experiments", "scripts", "tests"]
