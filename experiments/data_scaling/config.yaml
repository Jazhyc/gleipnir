method: data_scaling
splits_dir: data/data_scaling/validation
output_dir: results/data_scaling/${method}
seed: 0

teacher:
  artifact: ???

student:
  model: Qwen/Qwen3.5-9B
  model_loader: causal_lm
  init_adapter: null
  target_mode: teacher
  teacher_sources: null
  soft_teacher_artifact: ???
  override_cached_prompt: false
  require_teacher_label_match: true
  record_identity_field: null
  train_limit: null
  train_fraction: 1.0
  train_fraction_seed: ${seed}
  selection_manifest: ???
  label_only_manifest: null
  dataset_name_contains: null
  max_prompt_chars: 3000
  context_truncation: tail
  include_reasoning: false
  reasoning_max_chars: 0
  reasoning_truncation: head_tail
  exclude_final_output_from_context: false
  reasoning_dropout_probability: 0.0
  reasoning_dropout_seed: ${seed}
  max_length: 4608
  output_dir: ${output_dir}/adapter
  prompt: "unused: cached source-specific student prompts are authoritative"
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    exclude_modules: ".*(visual|vision_tower|merger|patch_embed).*"
  training:
    optimizer: adamw
    optim: adamw_torch
    num_train_epochs: 2.0
    max_steps: -1
    learning_rate: 5.0e-5
    muon_learning_rate: 3.0e-5
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    warmup_ratio: 0.03
    weight_decay: 0.0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    torch_compile: false
    torch_compile_backend: inductor
    torch_compile_mode: default
    logging_steps: 5
    completion_loss_weight: 0.0
    direct_loss_weight: 0.0
    pairwise_loss_weight: 0.0
    pairwise_temperature: 1.0
    soft_loss_weight: 1.0
    soft_loss_type: bce
    soft_target_logit_center: 0.0
    soft_target_logit_scale: 1.0
    soft_huber_delta: 1.0
    ordinal_soft_loss_weight: 0.0
    paired_batching: false
    paired_batching_mode: interleaved

hydra:
  run:
    dir: logs/data_scaling/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/data_scaling/hydra_multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
