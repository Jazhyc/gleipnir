defaults:
  - systems_screen@_global_: qwen35_4b_b200_fast
  - _self_

hydra:
  searchpath:
    - pkg://gleipnir.configs

campaign_id: gleipnir4b-b200-adaptive-microbatching-v1-profile
hypothesis: >-
  Variable physical microbatches improve the half-checkpoint recipe while
  retaining 32 equally weighted traces per optimizer update.

artifacts:
  result_dir: results/b200_adaptive_microbatching

data:
  directory: data/tool_trajectory_monitoring/distillation_scaling
  student_rows: mixed_student_rows.jsonl
  soft_targets: mixed_soft_targets.jsonl
  rows: 21837
  student_rows_sha256: f9b0a322f277991edae2510b658a2298c0c585d402b39f36d6ac86352bf1a76b
  soft_targets_sha256: 50f163f88b42ff8b6fc04d5ff1334766d6326895ad89c87501a93eeaeae137ee

selection:
  infer_missing_token_lengths: true

recipe:
  hydra_log_dir: logs/runpod/b200_adaptive_microbatching/hydra
  data_scope: mixed_monitoring_and_deception
  deception_rows: 13149
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  adaptive_microbatching:
    enabled: true
    max_padded_tokens: 8192
    max_micro_batch_size: 1
    profile: true

metadata_expectations:
  losses.accumulation_policy: sum_per_example_over_logical_batch_v1
  adaptive_microbatching.loss_normalization: sum_per_example_over_logical_batch_v1

conditions:
  - job_name: singleton
    design_role: matched_logical_batch_singleton_control

  - job_name: budget-8k
    design_role: conservative_adaptive_policy
    overrides:
      adaptive_microbatching:
        enabled: true
        max_padded_tokens: 8192
        max_micro_batch_size: 4
        profile: true

  - job_name: budget-16k
    design_role: larger_adaptive_policy
    overrides:
      adaptive_microbatching:
        enabled: true
        max_padded_tokens: 16384
        max_micro_batch_size: 8
        profile: true

preflight:
  condition: budget-16k

comparison:
  control: singleton
  candidate: budget-16k
  selection_job_field: adaptive_microbatching
  minimum_relative_improvement: 0.05
