defaults:
  - systems_screen@_global_: qwen35_4b_h100_fast
  - _self_

hydra:
  searchpath:
    - pkg://gleipnir.configs

campaign_id: gleipnir4b-b200-training-throughput-v2-warm-cache
hypothesis: >-
  After full checkpoint removal exceeded B200 memory, retaining half the linear
  checkpoints or using length-grouped microbatch 2 may improve warmed throughput.
gpus: 1

artifacts:
  result_dir: results/b200_training_throughput_warm

data:
  directory: data/tool_trajectory_monitoring/distillation_scaling
  student_rows: mixed_student_rows.jsonl
  soft_targets: mixed_soft_targets.jsonl
  rows: 21837
  student_rows_sha256: f9b0a322f277991edae2510b658a2298c0c585d402b39f36d6ac86352bf1a76b
  soft_targets_sha256: 50f163f88b42ff8b6fc04d5ff1334766d6326895ad89c87501a93eeaeae137ee

selection:
  rows: 320
  seed: 0
  preflight_rows: 32
  infer_missing_token_lengths: true

recipe:
  hydra_log_dir: logs/runpod/b200_training_throughput_warm/hydra
  data_scope: mixed_monitoring_and_deception
  deception_rows: 13149
  max_steps: 10
  selective_torch_compile_policy: full_attention_and_linear_shell

metadata_expectations:
  quantization:
    enabled: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16
  selective_torch_compile.policy: full_attention_and_linear_shell
  selective_torch_compile.disabled_linear_attention_layer_indices: ${_authoring.layer_indices.linear_attention}
  selective_torch_compile.disabled_linear_attention_kernel_layer_indices: []
  selective_torch_compile.disabled_linear_attention_kernel_components: []

conditions:
  - job_name: h100-recipe-b1
    design_role: matched_warmed_h100_recipe_control

  - job_name: half-checkpoint-b1
    design_role: retain_half_the_linear_checkpoints
    overrides:
      gradient_checkpointing_policy: explicit
      gradient_checkpointing_layer_indices: [0, 2, 5, 8, 10, 13, 16, 18, 21, 24, 26, 29]
    metadata_expectations:
      gradient_checkpointing_policy: explicit
      gradient_checkpointing_layer_indices: [0, 2, 5, 8, 10, 13, 16, 18, 21, 24, 26, 29]
      checkpointed_layer_indices: [0, 2, 5, 8, 10, 13, 16, 18, 21, 24, 26, 29]

  - job_name: length-grouped-b2
    design_role: smaller_length_grouped_batch_candidate
    overrides:
      micro_batch_size: 2
      gradient_accumulation_steps: 16
      train_sampling_strategy: group_by_length
    metadata_expectations:
      batching.train_sampling_strategy: group_by_length

preflight:
  condition: half-checkpoint-b1

comparison:
  control: h100-recipe-b1
  candidate: half-checkpoint-b1
  selection_job_field: gradient_checkpointing_policy
  minimum_relative_improvement: 0.05
